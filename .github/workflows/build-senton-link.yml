name: Build Senton Link Android

on:
  push:
    paths:
      - 'phone-app/**'
      - 'tests/senton_link_static_hard_test.py'
      - '.github/workflows/build-senton-link.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senton-link-android-publish
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      SENTON_KEYSTORE_PASSWORD: ${{ secrets.SENTON_KEYSTORE_PASSWORD }}
      SENTON_KEY_ALIAS: ${{ secrets.SENTON_KEY_ALIAS }}
      SENTON_KEY_PASSWORD: ${{ secrets.SENTON_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hard-test Android fail-safe source gates
        run: python3 tests/senton_link_static_hard_test.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      # CI test APKs use a stable, public, test-only signing key so a newer test APK
      # can update an older test APK on the dedicated test phone. This key is not a
      # production trust boundary and must never be used by the release signing config.
      - name: Install stable CI test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode phone-app/ci/senton-link-ci-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -F "SHA256: 26:F7:4E:DA:04:2A:9F:7B:17:CF:11:D4:CD:51:81:B8:5C:89:58:D8:7B:C5:93:62:D0:A7:D9:64:74:80:77:6E"

      # Always produce a non-production test APK after the fail-safe gates pass.
      # This APK is only for controlled launcher/app testing and is never published
      # to the production phone update channel.
      - name: Build hard-tested debug APK
        working-directory: phone-app
        run: /tmp/gradle-8.7/bin/gradle --no-daemon clean assembleDebug

      - name: Verify debug APK exists and uses stable test certificate
        run: |
          APK="phone-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}')
          test "$cert" = "26f74eda042a9f7b17cf11d4cd5181b85c8958d87bc59362d0a7d9647480776e"

      - name: Upload launcher test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Senton-Link-2.3.3-beta-launcher-test
          path: phone-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Detect permanent release signing secrets
        id: signing
        env:
          SENTON_KEYSTORE_B64: ${{ secrets.SENTON_KEYSTORE_B64 }}
        run: |
          if [ -n "$SENTON_KEYSTORE_B64" ] && \
             [ -n "$SENTON_KEYSTORE_PASSWORD" ] && \
             [ -n "$SENTON_KEY_ALIAS" ] && \
             [ -n "$SENTON_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Permanent release signing secrets are not configured; signed release publication will remain blocked."
          fi

      - name: Prepare permanent release signing keystore
        if: steps.signing.outputs.available == 'true'
        env:
          SENTON_KEYSTORE_B64: ${{ secrets.SENTON_KEYSTORE_B64 }}
        run: |
          printf '%s' "$SENTON_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/senton-link-release.jks"
          test -s "$RUNNER_TEMP/senton-link-release.jks"
          chmod 600 "$RUNNER_TEMP/senton-link-release.jks"
          echo "SENTON_KEYSTORE_FILE=$RUNNER_TEMP/senton-link-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: phone-app
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease

      - name: Verify APK signature and certificate
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="phone-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

      - name: Upload signed installable APK artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Senton-Link-2.3.3-beta-signed-release
          path: phone-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Senton Link 2.3.3-beta
        if: steps.signing.outputs.available == 'true'
        run: |
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists. Skipping stale phone package."
            exit 0
          fi
          mkdir -p phone-releases
          cp phone-app/app/build/outputs/apk/release/app-release.apk phone-releases/Senton-Link.apk
          sha=$(sha256sum phone-releases/Senton-Link.apk | awk '{print $1}')
          cat > phone-update.json <<EOF
          {
            "version": "2.3.3-beta",
            "versionCode": 2303,
            "download_url": "https://raw.githubusercontent.com/77m4wkbtzk-a11y/senton-control-updates/main/phone-releases/Senton-Link.apk",
            "sha256": "$sha",
            "channel": "beta",
            "priority": "high",
            "mandatory": false,
            "notes": "Senton Link 2.3.3-beta signed release: dedicated launcher mode foundation, closable update progress page, temporary explicit test mode, and SHA-256 verified updater."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phone-releases/Senton-Link.apk phone-update.json
          git diff --cached --quiet || git commit -m "Publish signed Senton Link 2.3.3-beta"
          git push origin main

      - name: Signed release remains safely blocked
        if: steps.signing.outputs.available != 'true'
        run: |
          echo "Launcher test APK built successfully."
          echo "Production phone update was NOT published because permanent release signing secrets are missing."
