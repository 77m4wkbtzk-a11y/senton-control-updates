name: Build Senton Link Android

on:
  push:
    paths:
      - 'phone-app/**'
      - '.github/workflows/build-senton-link.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senton-link-android-publish
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        working-directory: phone-app
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

      - name: Publish phone APK
        run: |
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists. Skipping stale phone package."
            exit 0
          fi

          mkdir -p phone-releases
          cp phone-app/app/build/outputs/apk/debug/app-debug.apk phone-releases/Senton-Link.apk
          sha=$(sha256sum phone-releases/Senton-Link.apk | awk '{print $1}')
          cat > phone-update.json <<EOF
          {
            "version": "0.2.1",
            "versionCode": 201,
            "download_url": "https://raw.githubusercontent.com/77m4wkbtzk-a11y/senton-control-updates/main/phone-releases/Senton-Link.apk",
            "sha256": "$sha",
            "channel": "test",
            "notes": "Senton Link v0.2.1 updater test build."
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phone-releases/Senton-Link.apk phone-update.json
          git diff --cached --quiet || git commit -m "Publish Senton Link Android test 0.2.1"
          git push origin main
