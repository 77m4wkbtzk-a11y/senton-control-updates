name: Build Senton Control Admin

on:
  push:
    branches:
      - 'admin-beta'
    paths:
      - 'source/**'
      - '.github/workflows/build-senton.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senton-control-admin-publish
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout admin channel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.7,<7" pyinstaller

      - name: Validate admin source
        shell: powershell
        run: |
          python -m py_compile source/admin_main.py source/main.py source/config.py source/pi_client.py source/updater.py source/dashboard.py

      - name: Hard test admin channel
        shell: powershell
        run: |
          @'
          import hashlib
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "source")
          import config
          from pi_client import PiClient
          from updater import verify_file_sha256

          assert config.ADMIN_UPDATE_CHANNEL is True
          assert "admin-beta/admin/update.json" in config.UPDATE_MANIFEST_URL
          assert getattr(config, "PUBLIC_UPDATE_MANIFEST_URL", "").endswith("/main/update.json")

          raw = b"\xef\xbb\xbf" + json.dumps({"version": config.APP_VERSION}).encode("utf-8")
          assert json.loads(raw.decode("utf-8-sig"))["version"] == config.APP_VERSION

          with tempfile.NamedTemporaryFile(delete=False) as f:
              f.write(b"senton-update-integrity-test")
              test_path = Path(f.name)
          expected = hashlib.sha256(b"senton-update-integrity-test").hexdigest()
          assert verify_file_sha256(test_path, expected) is True
          try:
              verify_file_sha256(test_path, "0" * 64)
          except RuntimeError:
              pass
          else:
              raise AssertionError("Bad SHA-256 was not rejected")
          test_path.unlink(missing_ok=True)

          pi = PiClient()
          assert pi.get_status()["simulation"] is True
          pi.send_command("demo")
          assert any(pi.get_status()["speed_kmh"] > 0 for _ in range(12))
          pi.send_command("stop")
          for _ in range(20):
              status = pi.get_status()
          assert status["speed_kmh"] == 0.0
          assert status["throttle"] == "NEUTRAL"
          print(f"Senton Control v{config.APP_VERSION} admin channel hard tests passed")
          '@ | python -

      - name: Build admin EXE
        shell: powershell
        run: |
          cd source
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name "Senton Control" admin_main.py

      - name: Publish admin-only package
        shell: powershell
        run: |
          git fetch origin admin-beta
          $remoteSha = (git rev-parse origin/admin-beta).Trim()
          if ($remoteSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer admin-beta commit exists. Skipping stale admin package."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path admin | Out-Null
          Copy-Item "source/dist/Senton Control.exe" "admin/Senton-Control.exe" -Force

          $version = python -c "import sys; sys.path.insert(0, 'source'); import config; print(config.APP_VERSION)"
          $hash = (Get-FileHash "admin/Senton-Control.exe" -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = $version.Trim()
            download_url = "https://raw.githubusercontent.com/77m4wkbtzk-a11y/senton-control-updates/admin-beta/admin/Senton-Control.exe"
            sha256 = $hash
            notes = "Senton Control v$($version.Trim()) OWNER ADMIN beta. Hash-verified update package."
            required = $false
            channel = "admin"
          } | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "admin/update.json"), $manifest, $utf8NoBom)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/Senton-Control.exe admin/update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish Senton Control v$($version.Trim()) admin beta"
            git push origin admin-beta
            if ($LASTEXITCODE -ne 0) {
              Write-Host "admin-beta advanced during publishing. Package not forced; newer run will publish."
              exit 0
            }
          }

      - name: Confirm channel isolation
        shell: powershell
        run: |
          Write-Host "Admin package published only to admin-beta."
          Write-Host "Public main/update.json was not modified by this workflow."
