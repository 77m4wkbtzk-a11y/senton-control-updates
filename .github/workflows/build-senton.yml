name: Build Senton Control

on:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-senton.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senton-control-beta-publish
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.7,<7" pyinstaller

      - name: Validate source
        shell: powershell
        run: |
          python -m py_compile source/main.py source/config.py source/pi_client.py source/updater.py source/dashboard.py

      - name: Hard test simulation and updater
        shell: powershell
        run: |
          @'
          import json
          import sys
          sys.path.insert(0, "source")

          import config
          from pi_client import PiClient

          assert config.APP_VERSION == "1.2.3", config.APP_VERSION

          # BOM-tolerant manifest parsing test.
          raw = b"\xef\xbb\xbf" + json.dumps({"version": "1.2.3"}).encode("utf-8")
          manifest = json.loads(raw.decode("utf-8-sig"))
          assert manifest["version"] == "1.2.3"

          # Simulation state/command tests.
          pi = PiClient()
          status = pi.get_status()
          assert status["simulation"] is True
          assert status["simulation_type"] == "AI"
          assert status["speed_kmh"] == 0.0

          pi.send_command("demo")
          moving = False
          for _ in range(12):
              status = pi.get_status()
              if status["speed_kmh"] > 0:
                  moving = True
          assert moving, "Demo simulation never accelerated"

          pi.send_command("stop")
          for _ in range(20):
              status = pi.get_status()
          assert status["speed_kmh"] == 0.0
          assert status["throttle"] == "NEUTRAL"

          pi.send_command("return_home")
          before = pi.distance_home
          for _ in range(10):
              status = pi.get_status()
          assert pi.distance_home <= before

          print("Senton Control v1.2.3 hard tests passed")
          '@ | python -

      - name: Build EXE
        shell: powershell
        run: |
          cd source
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name "Senton Control" main.py

      - name: Release hold
        shell: powershell
        run: |
          Write-Host "Senton Control release HOLD is active."
          Write-Host "Build and hard tests may complete, but this workflow will not publish the EXE or update.json."
          Write-Host "Live updater remains unchanged until the release hold is removed."
