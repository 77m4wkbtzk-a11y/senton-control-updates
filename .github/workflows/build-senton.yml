name: Build Senton Control

on:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-senton.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senton-control-beta-publish
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.7,<7" pyinstaller

      - name: Validate source
        shell: powershell
        run: |
          python -m py_compile source/main.py source/config.py source/pi_client.py source/updater.py source/dashboard.py

      - name: Hard test simulation and updater
        shell: powershell
        run: |
          @'
          import json
          import sys
          sys.path.insert(0, "source")

          import config
          from pi_client import PiClient

          assert config.APP_VERSION == "1.2.3", config.APP_VERSION

          raw = b"\xef\xbb\xbf" + json.dumps({"version": "1.2.3"}).encode("utf-8")
          manifest = json.loads(raw.decode("utf-8-sig"))
          assert manifest["version"] == "1.2.3"

          pi = PiClient()
          status = pi.get_status()
          assert status["simulation"] is True
          assert status["simulation_type"] == "AI"
          assert status["speed_kmh"] == 0.0

          pi.send_command("demo")
          moving = False
          for _ in range(12):
              status = pi.get_status()
              if status["speed_kmh"] > 0:
                  moving = True
          assert moving, "Demo simulation never accelerated"

          pi.send_command("stop")
          for _ in range(20):
              status = pi.get_status()
          assert status["speed_kmh"] == 0.0
          assert status["throttle"] == "NEUTRAL"

          pi.send_command("return_home")
          before = pi.distance_home
          for _ in range(10):
              status = pi.get_status()
          assert pi.distance_home <= before

          print("Senton Control v1.2.3 hard tests passed")
          '@ | python -

      - name: Build EXE
        shell: powershell
        run: |
          cd source
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name "Senton Control" main.py

      - name: Publish verified v1.2.3 package
        shell: powershell
        run: |
          git fetch origin main
          $remoteSha = (git rev-parse origin/main).Trim()
          if ($remoteSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer main commit exists. Skipping stale package."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Copy-Item "source/dist/Senton Control.exe" "releases/Senton-Control.exe" -Force

          $version = python -c "import sys; sys.path.insert(0, 'source'); import config; print(config.APP_VERSION)"
          $hash = (Get-FileHash "releases/Senton-Control.exe" -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = $version.Trim()
            download_url = "https://raw.githubusercontent.com/77m4wkbtzk-a11y/senton-control-updates/main/releases/Senton-Control.exe"
            notes = "Senton Control v$($version.Trim()) beta update. Hard-tested build with updater BOM fix and AI simulation."
            required = $false
            sha256 = $hash
            channel = "public"
          } | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "update.json"), $manifest, $utf8NoBom)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Senton-Control.exe update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish verified Senton Control v$($version.Trim()) package"
            git push origin main
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Main advanced during publishing. Package not forced; newer run will publish."
              exit 0
            }
          }
