name: Build Senton Control

on:
  push:
    paths:
      - '.github/workflows/build-senton.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.7,<7" pyinstaller

      - name: Validate source
        shell: powershell
        run: |
          python -m py_compile source/main.py source/config.py source/pi_client.py source/updater.py source/dashboard.py

      - name: Build EXE
        shell: powershell
        run: |
          cd source
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name "Senton Control" main.py

      - name: Publish update executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Copy-Item "source/dist/Senton Control.exe" "releases/Senton-Control.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Senton-Control.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Build Senton Control v1.2.1"
            git pull --rebase origin main
            git push origin main
          }

# v1.2.1 publish fix
