name: Build Senton Control

on:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-senton.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senton-control-beta-publish
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.7,<7" pyinstaller

      - name: Validate source
        shell: powershell
        run: |
          python -m py_compile source/admin_main.py source/main.py source/config.py source/pi_client.py source/updater.py source/dashboard.py source/cleanup.py source/privacy_guard.py source/universal_updater_ui.py

      - name: Hard test simulation updater old-update cleanup and Privacy Guard
        shell: powershell
        run: |
          @'
          import hashlib
          import inspect
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "source")

          import config
          import universal_updater_ui
          from cleanup import cleanup_obsolete_update_artifacts, DIST_ARTIFACT_NAMES, TEMP_ARTIFACT_NAMES
          from pi_client import PiClient
          from privacy_guard import PrivacyGuard
          from updater import verify_file_sha256

          assert config.APP_VERSION == "1.2.10", f"Unexpected build version: {config.APP_VERSION}"
          assert hasattr(universal_updater_ui, "install_universal_update_button")
          assert hasattr(universal_updater_ui, "_show_previous_update_result")
          raw = b"\xef\xbb\xbf" + json.dumps({"version": config.APP_VERSION}).encode("utf-8")
          manifest = json.loads(raw.decode("utf-8-sig"))
          assert manifest["version"] == config.APP_VERSION

          with tempfile.TemporaryDirectory() as install_root, tempfile.TemporaryDirectory() as temp_root:
              install_root = Path(install_root)
              temp_root = Path(temp_root)
              dist = install_root / "dist"
              dist.mkdir(parents=True)

              active_exe = dist / "Senton Control.exe"
              active_exe.write_bytes(b"ACTIVE-1.2.10")
              unrelated = dist / "keep-me.txt"
              unrelated.write_text("keep", encoding="utf-8")

              for name in DIST_ARTIFACT_NAMES:
                  (dist / name).write_bytes(b"obsolete")
              for name in TEMP_ARTIFACT_NAMES:
                  (temp_root / name).write_bytes(b"obsolete")

              removed = cleanup_obsolete_update_artifacts(install_root, temp_root)
              assert len(removed) == len(DIST_ARTIFACT_NAMES) + len(TEMP_ARTIFACT_NAMES)
              assert active_exe.exists()
              assert active_exe.read_bytes() == b"ACTIVE-1.2.10"
              assert unrelated.exists()
              assert cleanup_obsolete_update_artifacts(install_root, temp_root) == []

          with tempfile.NamedTemporaryFile(delete=False) as f:
              f.write(b"senton-update-integrity-test")
              test_path = Path(f.name)
          expected = hashlib.sha256(b"senton-update-integrity-test").hexdigest()
          assert verify_file_sha256(test_path, expected) is True
          try:
              verify_file_sha256(test_path, "0" * 64)
          except RuntimeError:
              pass
          else:
              raise AssertionError("Bad SHA-256 was not rejected")
          test_path.unlink(missing_ok=True)

          guard = PrivacyGuard()
          assert guard.camera_name == "Main Camera"
          assert guard.locked is False
          assert guard.sign_is_restricted("STAFF TOILET") is True
          assert guard.sign_is_restricted("Changing Room") is True
          assert guard.sign_is_restricted("Office") is False

          event = guard.trigger_from_sign("TOILET", "evidence/exterior-door.jpg")
          assert guard.locked is True
          assert event.camera_name == "Main Camera"
          assert event.evidence_path and event.evidence_path.endswith("exterior-door.jpg")
          assert event.detected_text == "TOILET"

          unlock_params = list(inspect.signature(PrivacyGuard.authorise_phone_unlock).parameters)
          assert unlock_params == ["self", "approved"]
          assert guard.authorise_phone_unlock(False) is False
          assert guard.locked is True
          assert guard.authorise_phone_unlock(True) is True
          assert guard.locked is False

          private_event = guard.trigger_private_area_view()
          assert guard.locked is True
          assert private_event.evidence_path is None

          pi = PiClient()
          status = pi.get_status()
          assert status["simulation"] is True
          assert status["simulation_type"] == "AI"
          assert status["speed_kmh"] == 0.0

          pi.send_command("demo")
          moving = False
          for _ in range(12):
              status = pi.get_status()
              if status["speed_kmh"] > 0:
                  moving = True
          assert moving

          pi.send_command("stop")
          for _ in range(20):
              status = pi.get_status()
          assert status["speed_kmh"] == 0.0
          assert status["throttle"] == "NEUTRAL"

          pi.send_command("return_home")
          before = pi.distance_home
          for _ in range(10):
              status = pi.get_status()
          assert pi.distance_home <= before

          print(f"Senton Control v{config.APP_VERSION} hard tests passed, including universal updater recovery")
          '@ | python -

      - name: Build public EXE
        shell: powershell
        run: |
          cd source
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name "Senton Control" main.py

      - name: Build owner admin EXE
        shell: powershell
        run: |
          cd source
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name "Senton Control Owner Admin" admin_main.py

      - name: Publish verified beta packages
        shell: powershell
        run: |
          $releaseReady = python -c "import sys; sys.path.insert(0, 'source'); import config; print('true' if getattr(config, 'PRIVACY_GUARD_RELEASE_READY', False) else 'false')"
          if ($releaseReady.Trim() -ne 'true') {
            Write-Host "Senton Control release is not ready. Build completed but live publication is blocked."
            exit 0
          }

          git fetch origin main
          $remoteSha = (git rev-parse origin/main).Trim()
          if ($remoteSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer main commit exists. Skipping stale package."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Copy-Item "source/dist/Senton Control.exe" "releases/Senton-Control.exe" -Force
          Copy-Item "source/dist/Senton Control Owner Admin.exe" "releases/Senton-Control-Owner-Admin.exe" -Force

          $version = python -c "import sys; sys.path.insert(0, 'source'); import config; print(config.APP_VERSION)"
          $hash = (Get-FileHash "releases/Senton-Control.exe" -Algorithm SHA256).Hash.ToLower()
          $adminHash = (Get-FileHash "releases/Senton-Control-Owner-Admin.exe" -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = $version.Trim()
            download_url = "https://raw.githubusercontent.com/77m4wkbtzk-a11y/senton-control-updates/main/releases/Senton-Control.exe"
            sha256 = $hash
            owner_admin_download_url = "https://raw.githubusercontent.com/77m4wkbtzk-a11y/senton-control-updates/main/releases/Senton-Control-Owner-Admin.exe"
            owner_admin_sha256 = $adminHash
            notes = "Senton Control v$($version.Trim()) in-app update handoff, restart and recovery-status repair with Privacy Guard baseline."
            required = $false
            channel = "public"
          } | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "update.json"), $manifest, $utf8NoBom)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Senton-Control.exe releases/Senton-Control-Owner-Admin.exe update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish verified Senton Control v$($version.Trim()) beta packages"
            git push origin main
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Main advanced during publishing. Package not forced; newer run will publish."
              exit 0
            }
          }
